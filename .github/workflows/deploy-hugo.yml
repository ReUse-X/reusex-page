# Build the site with the flake's Hugo (same version as the dev shell),
# check it, and deploy main to GitHub Pages (https://reuse-x.com/).
name: Build and deploy site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Lint content and tokens
        run: |
          nix develop .#ci -c python3 .claude/skills/design-studio/scripts/content_lint.py
          nix develop .#ci -c python3 .claude/skills/design-studio/scripts/token_lint.py

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: nix develop .#ci -c hugo --minify --gc --panicOnWarning

      - name: Check links
        run: nix develop .#ci -c lychee --offline --no-progress --root-dir "$PWD/public" 'public/**/*.html'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
