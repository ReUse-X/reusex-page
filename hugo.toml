# Site configuration: identity, languages, navigation and site-wide links.
# Page content lives in content/<lang>/, lists of things (people, partners,
# contact, socials) in data/, and all design in themes/reuse-x/.

baseURL = 'https://reuse-x.com/'
title = 'ReUseX'
theme = 'reuse-x'
disableKinds = ['taxonomy', 'term']

defaultContentLanguage = 'en'
# Danish is set up but not published until content/da/ exists.
disableLanguages = ['da']

[languages]
  [languages.en]
    contentDir = 'content/en'
    label = 'English'
    locale = 'en'
    weight = 1
  [languages.da]
    contentDir = 'content/da'
    label = 'Dansk'
    locale = 'da'
    weight = 2

[params]
  description = 'Revolutionizing resource reuse for a sustainable future'
  # The ReUseX app. Content links to it with `app:<path>` (see the link partial).
  app_url = 'https://app.reuse-x.com/'
  footer_text = 'Building the future of sustainable resource management through innovative technology and collaborative networks.'

[markup.goldmark.parser.attribute]
  block = true

# ---------------------------------------------------------------------------
# Navigation — the only place menus are defined. Pages never set menu entries.
# ---------------------------------------------------------------------------
[menus]
  [[menus.main]]
    name = 'Solution'
    pageRef = '/solution'
    weight = 10
  [[menus.main]]
    name = 'How it works'
    pageRef = '/how-it-works'
    weight = 20
  [[menus.main]]
    name = 'Vision'
    pageRef = '/vision'
    weight = 30
  [[menus.main]]
    name = 'Roadmap'
    pageRef = '/roadmap'
    weight = 40
  [[menus.main]]
    name = 'People'
    pageRef = '/people'
    weight = 50
  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 60

  # Footer: top-level entries are column headings, children are the links.
  [[menus.footer]]
    name = 'Product'
    identifier = 'product'
    weight = 10
  [[menus.footer]]
    name = 'Pilots'
    pageRef = '/pilots'
    parent = 'product'
    weight = 10
  [[menus.footer]]
    name = 'Research'
    pageRef = '/research'
    parent = 'product'
    weight = 20
  [[menus.footer]]
    name = 'Pitch deck'
    pageRef = '/pitchdeck'
    parent = 'product'
    weight = 30
  [[menus.footer]]
    name = 'Company'
    identifier = 'company'
    weight = 20
  [[menus.footer]]
    name = 'People'
    pageRef = '/people'
    parent = 'company'
    weight = 10
  [[menus.footer]]
    name = 'Contact'
    pageRef = '/contact'
    parent = 'company'
    weight = 20
