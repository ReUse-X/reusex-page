<!doctype html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
{{- with .File }}{{ partial "frontmatter-check.html" $ }}{{ end }}
<body class="layout-{{ .Layout | default "default" }}">
  <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
