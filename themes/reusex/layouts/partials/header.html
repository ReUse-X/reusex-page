<nav class="container-custom py-4">
  <div class="flex items-center justify-between">
    <div class="flex items-center space-x-4">
      <h1 class="font-display text-2xl font-extrabold" style="color: var(--heading-text);">
        {{ site.Title }}
      </h1>
    </div>
    <div class="hidden md:flex items-center space-x-8">
      {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
    </div>
    <div class="hidden md:flex items-center space-x-4">
      <button id="theme-toggle" aria-label="Toggle light/dark theme" class="p-2 rounded-lg transition-colors duration-200" style="color: var(--heading-text);">
        <!-- Sun icon: visible in dark mode, click to switch to light -->
        <svg id="theme-icon-sun" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <!-- Moon icon: visible in light mode, click to switch to dark -->
        <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
      <a href="https://reusex.mc.chrk.site/projects" target="_blank" rel="noopener noreferrer" class="btn-solid text-sm px-4 py-2" style="background-color: var(--cta-bg); color: var(--cta-text);">
        Log in
      </a>
    </div>
    <button class="open-mobile-menu md:hidden p-2 rounded-lg transition-colors duration-200" style="color: var(--heading-text);">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>
</nav>
<div class="mobile-menu md:hidden fixed inset-0 z-50" style="background-color: var(--section3-bg);">
  <div class="flex flex-col" style="height: 100vh; width: 100vw;">
    <div class="flex items-center justify-between p-4 border-b" style="min-height: 64px; border-color: var(--border);">
      <h1 class="font-display text-2xl font-extrabold" style="color: var(--heading-text);">
        {{ site.Title }}
      </h1>
      <div class="flex items-center space-x-2">
        <button class="mobile-theme-toggle p-2 rounded-lg transition-colors duration-200" aria-label="Toggle light/dark theme" style="color: var(--heading-text);">
          <svg class="mobile-theme-icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg class="mobile-theme-icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
        <button class="close-mobile-menu p-2 rounded-lg transition-colors duration-200" style="color: var(--heading-text);">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto" style="padding: 1.5rem; background-color: var(--surface-bg); border-radius: 0.75rem; margin: 1rem;">
      {{ with site.Menus.main }}
        <nav>
          <ul style="list-style: none; padding: 0; margin: 0;">
            {{ range . }}
              <li style="margin-bottom: 0.5rem;">
                <a href="{{ .URL }}" class="block transition-colors duration-200 font-semibold" style="display: block; padding: 0.75rem 1rem; font-size: 1.125rem; color: var(--heading-text); border-radius: 0.5rem; text-decoration: none;">
                  {{ .Name }}
                </a>
              </li>
            {{ end }}
          </ul>
        </nav>
      {{ end }}
      <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
        <a href="https://reusex.mc.chrk.site/projects" target="_blank" rel="noopener noreferrer" class="btn-solid" style="display: block; padding: 0.75rem 1.5rem; text-align: center; background-color: var(--cta-bg); color: var(--cta-text); border-radius: 0.375rem; font-weight: 600; text-decoration: none;">
          Log in
        </a>
      </div>
    </div>
  </div>
</div>
